
    @if (loading()) {
      <div class="h-48 animate-pulse rounded-xl bg-[var(--kraft-100)]"></div>
    } @else {
      <form class="mx-auto max-w-xl space-y-5" [formGroup]="form" (ngSubmit)="save()">
        <section class="rounded-xl border border-[var(--kraft-300)] bg-white p-5">
          <h2 class="mb-2 font-black">{{ 'admin.ukrFreeTitle' | transloco }}</h2>
          <p class="mb-4 text-sm text-[var(--kraft-500)]">{{ 'admin.ukrFreeHint' | transloco }}</p>
          <label class="block text-sm font-bold">
            {{ 'admin.ukrFreeAmount' | transloco }}
            <input
              formControlName="ukrposhtaFreeFromAmount"
              type="number"
              min="1"
              step="1"
              class="mt-1 w-full rounded-lg border border-[var(--kraft-400)] p-3 font-normal"
            />
          </label>
          @if (invalidAmount()) {
            <p class="mt-1 text-xs text-[var(--chili-500)]">{{ 'admin.ukrFreeInvalid' | transloco }}</p>
          }
        </section>
        <button
          type="submit"
          class="rounded-lg bg-[var(--marigold-400)] px-4 py-3 font-bold disabled:opacity-50"
          [disabled]="saving()"
        >
          {{ saving() ? ('common.saving' | transloco) : ('common.save' | transloco) }}
        </button>
      </form>
    }
