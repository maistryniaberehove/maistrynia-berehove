services:
  postgres:
    image: postgres:16-alpine
    container_name: maistrynia_postgres
    environment:
      POSTGRES_DB: maistrynia_shop
      POSTGRES_USER: maistrynia
      POSTGRES_PASSWORD: maistrynia_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maistrynia -d maistrynia_shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: maistrynia_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@maistrynia.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
